AWSTemplateFormatVersion: "2010-09-09"
Description: "PetClinic: CFN creates VPC/Subnet/IGW/Routes/SG/EC2 + Java17 + Nginx + systemd (No Docker)"

Parameters:
  VpcCidr:
    Type: String
    Default: "192.168.0.0/22"
    Description: "CIDR for new VPC"

  PublicSubnetCidr:
    Type: String
    Default: "192.168.0.0/22"
    Description: "CIDR for public subnet inside VPC"

  AllowedSshCidr:
    Type: String
    Default: "0.0.0.0/0"
    Description: "Your public IP/32 recommended for SSH"

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: "Existing EC2 KeyPair name (used by Jenkins for SSH deploy)"

  AmiId:
    Type: AWS::EC2::Image::Id
    Description: "Ubuntu AMI ID (same region as AWS_REGION)"

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3a.micro
    Description: Free Tier eligible instance types only
  

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: petclinic-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: petclinic-igw

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: petclinic-public-subnet

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: petclinic-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH and HTTP
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedSshCidr
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: petclinic-sg

  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref AppSecurityGroup
      Tags:
        - Key: Name
          Value: petclinic-ec2
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive

          apt-get update -y
          apt-get install -y openjdk-17-jre nginx

          id petclinic >/dev/null 2>&1 || useradd -r -s /bin/false petclinic
          mkdir -p /opt/petclinic
          chown -R petclinic:petclinic /opt/petclinic

          cat >/etc/systemd/system/petclinic.service <<'EOF'
          [Unit]
          Description=Spring PetClinic Application
          After=network.target

          [Service]
          User=petclinic
          Group=petclinic
          WorkingDirectory=/opt/petclinic
          ExecStart=/usr/bin/java -jar /opt/petclinic/petclinic.jar
          SuccessExitStatus=143
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable petclinic

          cat >/etc/nginx/sites-available/petclinic <<'EOF'
          server {
              listen 80;
              server_name _;
              location / {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          EOF

          rm -f /etc/nginx/sites-enabled/default
          ln -sf /etc/nginx/sites-available/petclinic /etc/nginx/sites-enabled/petclinic
          nginx -t
          systemctl enable --now nginx

Outputs:
  VpcId:
    Value: !Ref VPC
  PublicSubnetId:
    Value: !Ref PublicSubnet
  InstancePrivateIp:
    Value: !GetAtt AppInstance.PrivateIp
  InstancePublicIp:
    Value: !GetAtt AppInstance.PublicIp
  AppUrl:
    Value: !Sub "http://${AppInstance.PublicIp}/"
